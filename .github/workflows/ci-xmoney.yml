# XMONEY CI — validate package structure (no deploy, no secrets)
name: XMONEY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, json, fileinfo
          tools: composer:v2
          coverage: none

      - name: Composer validate
        working-directory: backend-api
        run: composer validate --strict --no-check-publish

      - name: PHP syntax check (src)
        run: |
          set -euo pipefail
          find backend-api/src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHP syntax check (scripts)
        run: |
          set -euo pipefail
          find backend-api/scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build cPanel package (structure only)
        shell: pwsh
        run: |
          Set-Location deploy/cpanel
          ./Build-CpanelPackage.ps1
          $pkg = 'dist/xmoney-cpanel-package'
          test -f "$pkg/api/public/index.php"
          test -f "$pkg/index.html"
          test -d "$pkg/admin"
          test -f "$pkg/database/02_schema_no_create_db.sql"
          echo "Package structure OK"

      - name: Verify package can install API vendor
        working-directory: deploy/cpanel/dist/xmoney-cpanel-package/api
        run: |
          set -euo pipefail
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          test -f vendor/autoload.php

      - name: Verify migration 003 present
        run: test -f database/migrations/003_wallet_payments_analytics.sql
