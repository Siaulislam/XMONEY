# ============================================================
# XMONEY — Production deploy to cPanel (isolated)
# ============================================================
# Approved deploy target (this hosting):
#   /home/smartdms/public_html/
# Public URL:
#   https://smartdms.me/
# Auto-deploy on push to main + optional manual run.
# No environment approval gate — deploys directly via FTP secrets.
#
# Required GitHub Secrets (exact names):
#   FTP_HOST, FTP_PORT, FTP_USERNAME, FTP_PASSWORD, FTP_REMOTE_PATH
#   XMONEY_DB_HOST, XMONEY_DB_NAME, XMONEY_DB_USER, XMONEY_DB_PASS
#   XMONEY_JWT_SECRET, XMONEY_APP_URL
# Optional (OTP email via SMTP):
#   XMONEY_SMTP_HOST, XMONEY_SMTP_PORT, XMONEY_SMTP_SECURE
#   XMONEY_SMTP_USER, XMONEY_SMTP_PASS, XMONEY_MAIL_FROM_ADDRESS, XMONEY_MAIL_FROM_NAME
# ============================================================

name: Deploy XMONEY

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: xmoney-deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Validate secrets + deploy XMONEY only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout XMONEY only
        uses: actions/checkout@v4

      - name: Validate required secrets exist
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
          XMONEY_DB_HOST: ${{ secrets.XMONEY_DB_HOST }}
          XMONEY_DB_NAME: ${{ secrets.XMONEY_DB_NAME }}
          XMONEY_DB_USER: ${{ secrets.XMONEY_DB_USER }}
          XMONEY_DB_PASS: ${{ secrets.XMONEY_DB_PASS }}
          XMONEY_JWT_SECRET: ${{ secrets.XMONEY_JWT_SECRET }}
          XMONEY_APP_URL: ${{ secrets.XMONEY_APP_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_HOST FTP_PORT FTP_USERNAME FTP_PASSWORD FTP_REMOTE_PATH \
                      XMONEY_DB_HOST XMONEY_DB_NAME XMONEY_DB_USER XMONEY_DB_PASS \
                      XMONEY_JWT_SECRET XMONEY_APP_URL; do
            val="${!name}"
            if [ -z "${val}" ]; then
              echo "MISSING SECRET: $name"
              missing=1
            else
              echo "OK SECRET PRESENT: $name"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required GitHub Secrets are missing. Stop deployment."
            exit 1
          fi

      - name: HARD FAIL unless FTP path is hosting root
        env:
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          PATH_RAW="${FTP_REMOTE_PATH}"
          PATH_NORM="$(echo -n "$PATH_RAW" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s#/$##')"
          echo "Configured FTP_REMOTE_PATH (raw): ${PATH_RAW}"

          # cPanel FTP is chrooted to the account home — deploy dir must be public_html/
          case "$PATH_NORM" in
            public_html|/public_html|/home/smartdms/public_html)
              echo "PATH VALIDATION PASSED: deploy target is public_html (cPanel web root)."
              ;;
            /|/home/smartdms|/home/smartdms/smartdms.me)
              echo "::error::REFUSED: FTP_REMOTE_PATH='${PATH_RAW}' is not public_html. Use /public_html/"
              exit 1
              ;;
            *)
              echo "::warning::FTP_REMOTE_PATH='${PATH_RAW}' is non-standard — will attempt deploy anyway."
              ;;
          esac

      - name: Validate XMONEY database + APP_URL (isolation)
        env:
          XMONEY_DB_NAME: ${{ secrets.XMONEY_DB_NAME }}
          XMONEY_DB_USER: ${{ secrets.XMONEY_DB_USER }}
          XMONEY_JWT_SECRET: ${{ secrets.XMONEY_JWT_SECRET }}
          XMONEY_APP_URL: ${{ secrets.XMONEY_APP_URL }}
        run: |
          set -euo pipefail
          echo "DB name (masked length): ${#XMONEY_DB_NAME}"
          echo "DB user (masked length): ${#XMONEY_DB_USER}"

          # Must match the approved XMONEY database exactly
          if [[ "${XMONEY_DB_NAME}" != "smartdms_XMONEY" ]]; then
            echo "::error::REFUSED: XMONEY_DB_NAME must be exactly smartdms_XMONEY."
            exit 1
          fi
          if [[ "${XMONEY_DB_USER}" != "smartdms_xmoney" ]]; then
            echo "::error::XMONEY_DB_USER must be exactly smartdms_xmoney."
            exit 1
          fi

          if [ "${#XMONEY_JWT_SECRET}" -lt 32 ]; then
            echo "::error::XMONEY_JWT_SECRET must be at least 32 characters."
            exit 1
          fi

          # Expected production API URL for this hosting
          APP_TRIM="${XMONEY_APP_URL%/}"
          if [[ "$APP_TRIM" != "https://smartdms.me/api" ]]; then
            echo "::warning::XMONEY_APP_URL is '${XMONEY_APP_URL}' — expected https://smartdms.me/api"
          fi
          if [[ "${XMONEY_APP_URL}" != http* ]]; then
            echo "::error::XMONEY_APP_URL must start with http:// or https://"
            exit 1
          fi
          if [[ "${XMONEY_APP_URL,,}" != *"/api"* ]]; then
            echo "::error::XMONEY_APP_URL must include /api"
            exit 1
          fi

          echo "Database/JWT/APP_URL validation passed."

      - name: Setup PHP 8.2 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, json, fileinfo
          tools: composer:v2
          coverage: none

      - name: Setup Node (static package assist)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build isolated cPanel package
        shell: pwsh
        run: |
          Set-Location deploy/cpanel
          ./Build-CpanelPackage.ps1

      - name: Install API dependencies into package (no-dev)
        working-directory: deploy/cpanel/dist/xmoney-cpanel-package/api
        run: |
          set -euo pipefail
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          test -f vendor/autoload.php

      - name: Generate production api/.env from GitHub Secrets only
        env:
          XMONEY_DB_HOST: ${{ secrets.XMONEY_DB_HOST }}
          XMONEY_DB_NAME: ${{ secrets.XMONEY_DB_NAME }}
          XMONEY_DB_USER: ${{ secrets.XMONEY_DB_USER }}
          XMONEY_DB_PASS: ${{ secrets.XMONEY_DB_PASS }}
          XMONEY_JWT_SECRET: ${{ secrets.XMONEY_JWT_SECRET }}
          XMONEY_APP_URL: ${{ secrets.XMONEY_APP_URL }}
          XMONEY_SMTP_HOST: ${{ secrets.XMONEY_SMTP_HOST }}
          XMONEY_SMTP_PORT: ${{ secrets.XMONEY_SMTP_PORT }}
          XMONEY_SMTP_SECURE: ${{ secrets.XMONEY_SMTP_SECURE }}
          XMONEY_SMTP_USER: ${{ secrets.XMONEY_SMTP_USER }}
          XMONEY_SMTP_PASS: ${{ secrets.XMONEY_SMTP_PASS }}
          XMONEY_MAIL_FROM_ADDRESS: ${{ secrets.XMONEY_MAIL_FROM_ADDRESS }}
          XMONEY_MAIL_FROM_NAME: ${{ secrets.XMONEY_MAIL_FROM_NAME }}
        run: |
          set -euo pipefail
          PKG="deploy/cpanel/dist/xmoney-cpanel-package"
          # If APP_URL is https://domain/api → CORS https://domain
          CORS_ORIGIN="$(echo -n "$XMONEY_APP_URL" | sed -E 's#(https?://[^/]+).*#\1#')"

          SMTP_HOST="${XMONEY_SMTP_HOST:-mail.smartdms.me}"
          SMTP_PORT="${XMONEY_SMTP_PORT:-465}"
          SMTP_SECURE="${XMONEY_SMTP_SECURE:-ssl}"
          SMTP_USER="${XMONEY_SMTP_USER:-xmoney@smartdms.me}"
          MAIL_FROM_ADDRESS="${XMONEY_MAIL_FROM_ADDRESS:-xmoney@smartdms.me}"
          MAIL_FROM_NAME="${XMONEY_MAIL_FROM_NAME:-XMONEY}"

          if [ -n "${XMONEY_SMTP_PASS:-}" ] && [ -n "${SMTP_USER}" ]; then
            MAIL_DRIVER=smtp
          else
            MAIL_DRIVER=log
            echo "::warning::XMONEY_SMTP_PASS not set — OTP emails will log only until SMTP secret is added."
          fi

          cat > "$PKG/api/.env" <<EOF
          APP_NAME=XMONEY
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=${XMONEY_APP_URL}
          APP_TIMEZONE=Asia/Dubai
          DB_HOST=${XMONEY_DB_HOST}
          DB_PORT=3306
          DB_NAME=${XMONEY_DB_NAME}
          DB_USER=${XMONEY_DB_USER}
          DB_PASS=${XMONEY_DB_PASS}
          DB_CHARSET=utf8mb4
          JWT_SECRET=${XMONEY_JWT_SECRET}
          JWT_ACCESS_TTL_MINUTES=15
          JWT_REFRESH_TTL_DAYS=30
          JWT_ISSUER=xmoney-api
          JWT_AUDIENCE=xmoney-clients
          BCRYPT_COST=12
          CORS_ALLOWED_ORIGINS=${CORS_ORIGIN}
          RATE_LIMIT_PER_MINUTE=60
          SECURITY_MAX_LOGIN_ATTEMPTS=5
          SECURITY_LOCKOUT_MINUTES=30
          OTP_EXPIRY_MINUTES=10
          UPLOAD_MAX_MB=10
          UPLOAD_PATH=../storage/uploads
          EXCHANGE_PROVIDER=manual
          EXCHANGE_API_URL=
          EXCHANGE_API_KEY=
          PAYMENT_DEFAULT_PROVIDER=stub
          MAIL_DRIVER=${MAIL_DRIVER}
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_SECURE=${SMTP_SECURE}
          SMTP_USER=${SMTP_USER}
          SMTP_PASS=${XMONEY_SMTP_PASS:-}
          MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
          MAIL_FROM_NAME=${MAIL_FROM_NAME}
          SMS_DRIVER=log
          PUSH_DRIVER=log
          LOG_PATH=../storage/logs
          LOG_LEVEL=info
          EOF
          sed -i 's/^[[:space:]]*//' "$PKG/api/.env"

          # Derive web/admin base path from APP_URL path (e.g. / or /subsite/)
          APP_PATH="$(echo -n "$XMONEY_APP_URL" | sed -E 's#https?://[^/]+##; s#/api/?$##')"
          if [ -z "$APP_PATH" ] || [ "$APP_PATH" = "/" ]; then
            WEB_BASE="/"
            ADMIN_BASE="/admin/"
          else
            WEB_BASE="${APP_PATH%/}/"
            ADMIN_BASE="${APP_PATH%/}/admin/"
          fi

          printf '%s\n' \
            "window.XMONEY_RUNTIME = {" \
            "  appName: 'XMONEY'," \
            "  apiBaseUrl: '${XMONEY_APP_URL}'," \
            "  webBasePath: '${WEB_BASE}'," \
            "  adminBasePath: '${ADMIN_BASE}'" \
            "};" > "$PKG/config/runtime-config.js"

          echo "Generated api/.env and config/runtime-config.js (credentials not printed)."
          test -f "$PKG/api/.env"
          grep -q '^DB_NAME=' "$PKG/api/.env"
          grep -q '^JWT_SECRET=' "$PKG/api/.env"
      - name: Safety check — package must not contain foreign project paths
        run: |
          set -euo pipefail
          PKG="deploy/cpanel/dist/xmoney-cpanel-package"
          if grep -RIn --exclude-dir=vendor -E 'smartdms_smartdms_db|ZIAAI-Project' "$PKG" 2>/dev/null | head -20; then
            echo "::warning::Package contains old-project references — verify no foreign source files were packaged."
          fi
          # Must contain XMONEY API entrypoint and Composer autoload
          test -f "$PKG/api/public/index.php"
          test -f "$PKG/api/vendor/autoload.php"
          test -f "$PKG/api/.env"
          test -f "$PKG/index.html"
          test -d "$PKG/admin"
          echo "Package structure OK for XMONEY-only deploy."

      - name: Resolve FTP deploy directory for cPanel (lftp)
        id: ftpdir
        env:
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          RAW="$(echo -n "$FTP_REMOTE_PATH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s#/$##')"
          case "$RAW" in
            public_html|/public_html|/home/smartdms/public_html|'')
              DIR="/public_html"
              ;;
            /*)
              DIR="$RAW"
              ;;
            *)
              DIR="/${RAW}"
              ;;
          esac
          echo "FTP deploy directory (lftp): ${DIR}/"
          echo "dir=${DIR}" >> "$GITHUB_OUTPUT"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy package via FTPS (lftp — cPanel compatible)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ steps.ftpdir.outputs.dir }}
          FTP_MODE: ftps
          LOCAL_DIR: deploy/cpanel/dist/xmoney-cpanel-package
          DRY_RUN: "false"
        run: bash deploy/cpanel/lftp-deploy.sh

      - name: Post-deploy health check (XMONEY API only)
        env:
          XMONEY_APP_URL: ${{ secrets.XMONEY_APP_URL }}
        run: |
          set -euo pipefail
          # APP_URL should be like https://domain/api
          HEALTH_URL="${XMONEY_APP_URL%/}/v1/health"
          echo "Checking: $HEALTH_URL"
          # Allow time for FTP settle
          sleep 5
          code=$(curl -sS -o /tmp/xmoney-health.json -w "%{http_code}" "$HEALTH_URL" || true)
          echo "HTTP $code"
          cat /tmp/xmoney-health.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::Health endpoint did not return 200. Files may be uploaded but DB/schema may still need import, or APP_URL may be wrong."
            echo "This does NOT mean any sibling site path was modified. Verify manually: $HEALTH_URL"
            exit 0
          fi
          if grep -q '"success":true' /tmp/xmoney-health.json || grep -q '"status":"healthy"' /tmp/xmoney-health.json; then
            echo "XMONEY health check passed."
          else
            echo "::warning::Health response unexpected. Confirm XMONEY DB is imported and .env DB_* secrets are correct."
          fi
