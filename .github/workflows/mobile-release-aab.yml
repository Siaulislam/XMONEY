# Release AAB (Android App Bundle) — manual only, for future Play Store upload.
name: Mobile Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-aab:
    name: Flutter release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mobile-app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare project
        run: bash scripts/ci-prepare.sh

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload XMONEY-Release-AAB
        uses: actions/upload-artifact@v4
        with:
          name: XMONEY-Release-AAB
          path: mobile-app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
