# Build Flutter Web and deploy to GitHub Pages on every push to main.
# Preview URL: https://siaulislam.github.io/XMONEY/
name: Mobile Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-mobile-web-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Flutter Web → GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.verify.outputs.preview_url || steps.deploy.outputs.page_url }}

    defaults:
      run:
        working-directory: mobile-app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Install ImageMagick (branding placeholders)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare project (platforms, assets, analyze)
        run: bash scripts/ci-prepare.sh

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/XMONEY/"

      - name: Add .nojekyll (required for Flutter assets on GitHub Pages)
        run: touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-app/build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Verify preview is publicly accessible
        id: verify
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Deployed to: ${PAGE_URL}"
          echo "Waiting for GitHub Pages CDN (up to ~3 minutes)…"
          ok=0
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /tmp/preview.html -w '%{http_code}' -L "${PAGE_URL}" || true)"
            if [[ "$code" == "200" ]] && grep -qiE 'flutter|xmoney|main\.dart' /tmp/preview.html; then
              ok=1
              break
            fi
            echo "Attempt ${attempt}/12 — HTTP ${code}, retrying in 15s…"
            sleep 15
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Preview not reachable at ${PAGE_URL}"
            exit 1
          fi
          echo "preview_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "Preview verified: ${PAGE_URL}"

      - name: Write preview URL to job summary
        env:
          PAGE_URL: ${{ steps.verify.outputs.preview_url }}
        run: |
          {
            echo "## XMONEY Mobile Web Preview"
            echo ""
            echo "### Live Preview URL"
            echo ""
            echo "**${PAGE_URL}**"
            echo ""
            echo "Open this URL in your browser to review the mobile app UI."
            echo ""
            echo "Redeploys automatically on every push to \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
