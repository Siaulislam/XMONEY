<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="src/assets/branding/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="src/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="src/assets/branding/social-sharing.png" />
  <title>Transactions — XMONEY</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
  <script src="src/assets/js/xm-theme.js"></script>
  <script src="src/assets/js/xm-i18n.js"></script>
  <script src="src/assets/js/xm-responsive.js"></script>
  <script src="src/assets/js/xm-core.js"></script>
</head>
<body>
  <div data-xm-shell>
    <div class="xm-filters">
      <div class="xm-field"><label data-i18n="common.search">Search</label><input id="q" placeholder="Reference or receiver" data-i18n-placeholder="common.search" /></div>
      <div class="xm-field"><label data-i18n="common.status">Status</label>
        <select id="status"><option value="">All</option><option>completed</option><option>processing</option><option>pending_payment</option><option>failed</option><option>cancelled</option></select>
      </div>
      <div class="xm-field"><label>From</label><input id="from" type="date" /></div>
      <div class="xm-field"><label>To</label><input id="to" type="date" /></div>
      <button class="xm-btn xm-btn-primary" id="searchBtn" data-i18n="common.search">Search</button>
      <button class="xm-btn xm-btn-outline" id="exportBtn" data-i18n="common.export">Export CSV</button>
    </div>
    <div class="xm-card">
      <div class="xm-table-wrap">
        <table class="xm-table">
          <thead><tr><th>Reference</th><th>Receiver</th><th>Send</th><th>Receive</th><th>Fee</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="body"><tr><td colspan="7">Loading…</td></tr></tbody>
        </table>
      </div>
      <div class="xm-pagination"><span id="pageInfo"></span><div><button class="xm-btn xm-btn-outline" id="prevBtn">Previous</button> <button class="xm-btn xm-btn-outline" id="nextBtn">Next</button></div></div>
    </div>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script>
    let offset = 0;
    const limit = 25;
    let lastRows = [];

    function buildQuery() {
      const p = new URLSearchParams({ limit, offset });
      const q = document.getElementById('q').value.trim();
      const status = document.getElementById('status').value;
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (q) p.set('q', q);
      if (status) p.set('status', status);
      if (from) p.set('from', from);
      if (to) p.set('to', to);
      return p.toString();
    }

    async function load() {
      const res = await XMONEY.api('/v1/transfers?' + buildQuery());
      const body = document.getElementById('body');
      lastRows = XMONEY.listData(res);
      if (!lastRows.length) { body.innerHTML = '<tr><td colspan="7" class="xm-empty">No transactions found.</td></tr>'; }
      else {
        body.innerHTML = lastRows.map(t => `<tr>
          <td><a href="receipt.html?uuid=${t.uuid}">${t.reference_code}</a></td>
          <td>${t.receiver_name}<br/><small style="color:var(--xm-muted)">${t.country_code || ''}</small></td>
          <td>${XMONEY.formatMoney(t.send_amount, t.source_currency)}</td>
          <td>${XMONEY.formatMoney(t.receive_amount, t.target_currency)}</td>
          <td>${XMONEY.formatMoney(t.fee_amount, t.source_currency)}</td>
          <td>${XMONEY.statusBadge(t.status)}</td>
          <td>${new Date(t.created_at).toLocaleString()}</td></tr>`).join('');
      }
      const total = res.data?.total ?? lastRows.length;
      document.getElementById('pageInfo').textContent = `Showing ${offset + 1}–${Math.min(offset + limit, total)} of ${total}`;
      document.getElementById('prevBtn').disabled = offset <= 0;
      document.getElementById('nextBtn').disabled = offset + limit >= total;
    }

    (async () => {
      const profile = await XMShell.mount({ title: 'Transactions', headingKey: 'txn.history', heading: 'Transaction history' });
      if (!profile) return;
      document.getElementById('searchBtn').onclick = () => { offset = 0; load(); };
      document.getElementById('prevBtn').onclick = () => { offset = Math.max(0, offset - limit); load(); };
      document.getElementById('nextBtn').onclick = () => { offset += limit; load(); };
      document.getElementById('exportBtn').onclick = () => {
        if (!lastRows.length) return;
        const header = 'reference,receiver,send,receive,fee,status,date\n';
        const csv = header + lastRows.map(t =>
          [t.reference_code, t.receiver_name, t.send_amount, t.receive_amount, t.fee_amount, t.status, t.created_at].join(',')
        ).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = 'xmoney-transactions.csv';
        a.click();
      };
      load();
    })();
  </script>
</body>
</html>
