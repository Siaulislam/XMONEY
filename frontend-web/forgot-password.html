<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password — XMONEY</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
</head>
<body>
  <nav class="xm-nav">
    <div class="xm-container xm-nav-inner">
      <a href="index.html" class="xm-logo"><span class="xm-logo-mark">X</span> XMONEY</a>
    </div>
  </nav>
  <div class="xm-auth-wrap">
    <div class="xm-card xm-auth-card">
      <h1>Reset password</h1>
      <p class="sub">We will send an OTP to your email</p>
      <div id="alert" hidden></div>
      <form id="forgotForm">
        <div class="xm-field"><label>Email</label><input name="email" id="forgotEmail" type="email" required /></div>
        <button class="xm-btn xm-btn-primary xm-btn-block" type="submit" id="forgotBtn">Send OTP</button>
      </form>
      <hr style="margin:1.5rem 0;border:none;border-top:1px solid var(--xm-border)" />
      <form id="resetForm">
        <div class="xm-field"><label>Email</label><input name="email" id="resetEmail" type="email" required /></div>
        <div class="xm-field"><label>OTP</label><input name="otp" maxlength="6" required inputmode="numeric" /></div>
        <div class="xm-field"><label>New password</label><input name="password" type="password" required minlength="8" /></div>
        <button class="xm-btn xm-btn-outline xm-btn-block" type="submit" id="resetBtn">Update password</button>
      </form>
      <p style="margin-top:1rem;text-align:center;font-size:0.85rem">
        <button type="button" id="resendBtn" class="xm-btn xm-btn-outline" style="padding:0.35rem 0.7rem;font-size:0.85rem">Resend OTP</button>
        · <a href="login.html">Back to sign in</a>
      </p>
    </div>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = new FormData(e.target).get('email');
      const btn = document.getElementById('forgotBtn');
      XMONEY.setLoading(btn, true, 'Sending…');
      const res = await XMONEY.api('/v1/auth/forgot-password', { method: 'POST', body: { email } });
      XMONEY.setLoading(btn, false);
      document.getElementById('resetEmail').value = email;
      sessionStorage.setItem('xm_verify_email', email);
      sessionStorage.setItem('xm_otp_purpose', 'password_reset');
      if (res.data?.otp?.debug_otp) {
        XMONEY.showAlert(document.getElementById('alert'), 'Dev OTP: ' + res.data.otp.debug_otp, 'info');
      } else {
        XMONEY.showAlert(document.getElementById('alert'), res.message || 'Request sent', res.success ? 'success' : 'error');
      }
    });

    document.getElementById('resendBtn').onclick = async () => {
      const email = document.getElementById('resetEmail').value || document.getElementById('forgotEmail').value;
      if (!email) { XMONEY.toast('Enter email first', 'error'); return; }
      const res = await XMONEY.api('/v1/auth/resend-otp', { method: 'POST', body: { email, purpose: 'password_reset' } });
      if (res.data?.otp?.debug_otp) {
        XMONEY.showAlert(document.getElementById('alert'), 'Dev OTP: ' + res.data.otp.debug_otp, 'info');
      } else {
        XMONEY.toast(res.message || 'OTP resent', 'success');
      }
    };

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target).entries());
      const btn = document.getElementById('resetBtn');
      XMONEY.setLoading(btn, true, 'Updating…');
      const res = await XMONEY.api('/v1/auth/reset-password', { method: 'POST', body });
      XMONEY.setLoading(btn, false);
      if (!res.success) {
        XMONEY.showAlert(document.getElementById('alert'), res.message || 'Reset failed');
        return;
      }
      XMONEY.showAlert(document.getElementById('alert'), 'Password updated. You can sign in.', 'success');
      setTimeout(() => (window.location.href = 'login.html'), 1000);
    });
  </script>
</body>
</html>
