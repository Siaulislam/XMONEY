<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="src/assets/branding/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="src/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="src/assets/branding/social-sharing.png" />
  <title>Settings — XMONEY</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
  <script src="src/assets/js/xm-theme.js"></script>
  <script src="src/assets/js/xm-i18n.js"></script>
  <script src="src/assets/js/xm-responsive.js"></script>
  <script src="src/assets/js/xm-core.js"></script>
</head>
<body>
  <div data-xm-shell>
    <div id="alert" hidden></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem" class="settings-grid">
      <div class="xm-card">
        <h2 style="font-size:1.05rem;margin-bottom:0.75rem" data-i18n="settings.security">Security</h2>
        <p style="color:var(--xm-muted);font-size:0.9rem;margin-bottom:1rem" data-i18n="settings.securityHint">Manage password and signed-in devices.</p>
        <a href="profile.html" class="xm-btn xm-btn-primary" data-i18n="settings.openProfile">Open profile & security</a>
      </div>
      <div class="xm-card">
        <h2 style="font-size:1.05rem;margin-bottom:0.75rem" data-i18n="settings.preferences">Preferences</h2>
        <form id="prefForm">
          <div class="xm-field">
            <label data-i18n="settings.preferredLanguage">Preferred language</label>
            <select name="preferred_language" id="preferred_language">
              <option value="en">English</option>
              <option value="ar">Arabic</option>
              <option value="hi">Hindi</option>
              <option value="ur">Urdu</option>
            </select>
          </div>
          <div class="xm-field">
            <label data-i18n="settings.preferredCurrency">Preferred currency</label>
            <select name="preferred_currency" id="preferred_currency">
              <option>AED</option><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option><option>PKR</option>
            </select>
          </div>
          <button class="xm-btn xm-btn-outline" type="submit" id="saveBtn" data-i18n="settings.savePreferences">Save preferences</button>
        </form>
      </div>
      <div class="xm-card">
        <h2 style="font-size:1.05rem;margin-bottom:0.75rem" data-i18n="settings.session">Session</h2>
        <p style="font-size:0.85rem;color:var(--xm-muted);margin-bottom:0.75rem">Device ID: <code id="deviceId">—</code></p>
        <button type="button" class="xm-btn xm-btn-danger" id="logoutAllHint" data-i18n="settings.signOutDevice">Sign out this device</button>
      </div>
      <div class="xm-card">
        <h2 style="font-size:1.05rem;margin-bottom:0.75rem" data-i18n="settings.apiEndpoint">API endpoint</h2>
        <p style="font-size:0.85rem;color:var(--xm-muted);word-break:break-all" id="apiBase">—</p>
      </div>
    </div>
  </div>
  <style>@media(max-width:800px){.settings-grid{grid-template-columns:1fr!important}}</style>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script>
    (async () => {
      const profile = await XMShell.mount({ title: 'Settings', headingKey: 'nav.settings', heading: 'Settings' });
      if (!profile) return;
      document.getElementById('deviceId').textContent = XMONEY.getDeviceId();
      document.getElementById('apiBase').textContent = XMONEY.API_BASE;
      document.getElementById('preferred_language').value = profile.preferred_language || 'en';
      document.getElementById('preferred_currency').value = profile.preferred_currency || 'AED';
      document.getElementById('logoutAllHint').onclick = () => XMONEY.logout();

      document.getElementById('prefForm').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const btn = document.getElementById('saveBtn');
        XMONEY.setLoading(btn, true, 'Saving…');
        const res = await XMONEY.api('/v1/me', {
          method: 'PUT',
          body: {
            full_name: profile.full_name,
            country_code: profile.country_code,
            city: profile.city,
            address_line1: profile.address_line1,
            preferred_language: fd.get('preferred_language'),
            preferred_currency: fd.get('preferred_currency'),
          },
        });
        XMONEY.setLoading(btn, false);
        if (!res.success) {
          XMONEY.showAlert(document.getElementById('alert'), res.message || 'Save failed');
          return;
        }
        XMONEY.toast('Preferences saved', 'success');
      };
    })();
  </script>
</body>
</html>
