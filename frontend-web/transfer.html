<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="src/assets/branding/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="src/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="src/assets/branding/social-sharing.png" />
  <title>Send money — XMONEY</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
  <script src="src/assets/js/xm-theme.js"></script>
  <script src="src/assets/js/xm-i18n.js"></script>
  <script src="src/assets/js/xm-responsive.js"></script>
  <script src="src/assets/js/xm-core.js"></script>
</head>
<body>
  <div data-xm-shell>
    <div id="alert" hidden></div>
    <div class="xm-steps" id="steps">
      <div class="xm-step active" data-step="1" data-i18n="transfer.step.beneficiary">1. Beneficiary</div>
      <div class="xm-step" data-step="2" data-i18n="transfer.step.amount">2. Amount</div>
      <div class="xm-step" data-step="3" data-i18n="transfer.step.review">3. Review</div>
      <div class="xm-step" data-step="4" data-i18n="transfer.step.pay">4. Pay</div>
    </div>

    <div class="xm-card" style="max-width:640px" id="panel">
      <!-- Step 1 -->
      <section data-panel="1">
        <h2 style="font-size:1.1rem;margin-bottom:1rem" data-i18n="transfer.selectBeneficiary">Select beneficiary</h2>
        <div class="xm-field">
          <label data-i18n="transfer.beneficiary">Beneficiary</label>
          <select id="benSelect" required><option value="" data-i18n="loading">Loading…</option></select>
        </div>
        <p style="font-size:0.85rem;color:var(--xm-muted);margin-bottom:1rem"><span data-i18n="transfer.addBeneficiaryLink">Need a new receiver?</span> <a href="beneficiaries.html" data-i18n="transfer.addBeneficiary">Add beneficiary</a></p>
        <button type="button" class="xm-btn xm-btn-primary" id="toStep2" data-i18n="transfer.continue">Continue</button>
      </section>

      <!-- Step 2 -->
      <section data-panel="2" hidden>
        <h2 style="font-size:1.1rem;margin-bottom:1rem" data-i18n="transfer.amountCurrency">Amount & currency</h2>
        <div class="xm-field">
          <label data-i18n="transfer.youSend">You send</label>
          <select id="srcCur">
            <option value="AED">AED</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
          </select>
        </div>
        <div class="xm-field">
          <label>Amount</label>
          <input id="amount" type="number" min="1" step="0.01" required placeholder="0.00" />
        </div>
        <div id="quoteBox" class="xm-alert xm-alert-info" hidden></div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
          <button type="button" class="xm-btn xm-btn-outline" id="back1" data-i18n="transfer.back">Back</button>
          <button type="button" class="xm-btn xm-btn-outline" id="quoteBtn" data-i18n="transfer.getQuote">Get live quote</button>
          <button type="button" class="xm-btn xm-btn-primary" id="toStep3" data-i18n="transfer.reviewTransfer">Review transfer</button>
        </div>
      </section>

      <!-- Step 3 -->
      <section data-panel="3" hidden>
        <h2 style="font-size:1.1rem;margin-bottom:1rem" data-i18n="transfer.review">Review</h2>
        <div id="reviewBox" style="font-size:0.95rem;line-height:1.7"></div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:1rem">
          <button type="button" class="xm-btn xm-btn-outline" id="back2" data-i18n="transfer.back">Back</button>
          <button type="button" class="xm-btn xm-btn-primary" id="toStep4" data-i18n="transfer.confirmPay">Confirm & pay</button>
        </div>
      </section>

      <!-- Step 4 -->
      <section data-panel="4" hidden>
        <h2 style="font-size:1.1rem;margin-bottom:1rem" data-i18n="transfer.payment">Payment</h2>
        <div class="xm-field">
          <label data-i18n="wallet.paymentMethod">Payment method</label>
          <select id="payMethod">
            <option value="wallet">Wallet balance</option>
            <option value="card">Card</option>
            <option value="gateway">Payment gateway</option>
          </select>
        </div>
        <div id="payStatus" class="xm-alert xm-alert-info" hidden></div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
          <button type="button" class="xm-btn xm-btn-outline" id="back3" data-i18n="transfer.back">Back</button>
          <button type="button" class="xm-btn xm-btn-primary" id="payBtn" data-i18n="transfer.payNow">Pay now</button>
        </div>
      </section>
    </div>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script>
    const state = { beneficiary: null, quote: null, txn: null };

    function setStep(n) {
      document.querySelectorAll('[data-panel]').forEach(p => { p.hidden = p.getAttribute('data-panel') !== String(n); });
      document.querySelectorAll('.xm-step').forEach(s => {
        const sn = Number(s.dataset.step);
        s.classList.toggle('active', sn === n);
        s.classList.toggle('done', sn < n);
      });
    }

    (async () => {
      const profile = await XMShell.mount({ title: 'Send money', headingKey: 'nav.send', heading: 'Send money' });
      if (!profile) return;

      if (profile.kyc_status !== 'approved') {
        XMONEY.showAlert(document.getElementById('alert'), 'KYC must be approved before you can send money. Complete verification first.', 'info');
      }

      const limitsRes = await XMONEY.api('/v1/settings/public');
      if (limitsRes.success) {
        const amt = document.getElementById('amount');
        const min = limitsRes.data.transfer_min_amount;
        const max = limitsRes.data.transfer_max_amount;
        amt.min = min;
        amt.max = max;
        amt.placeholder = `${min} – ${max}`;
      }

      const curRes = await XMONEY.api('/v1/currencies');
      if (curRes.success && curRes.data.length) {
        const srcSel = document.getElementById('srcCur');
        srcSel.innerHTML = curRes.data.filter((c) => c.is_source).map((c) =>
          `<option value="${c.code}">${c.code} — ${c.name}</option>`
        ).join('');
      }

      const walletsRes = await XMONEY.api('/v1/wallets');
      const walletBalances = walletsRes.success && Array.isArray(walletsRes.data) ? walletsRes.data : [];

      function walletAvailable(currency) {
        const w = walletBalances.find((x) => x.currency_code === currency);
        if (w) return Number(w.available_balance ?? w.balance ?? 0);
        return 0;
      }

      const bens = await XMONEY.api('/v1/beneficiaries');
      const sel = document.getElementById('benSelect');
      if (!bens.success || !bens.data.length) {
        sel.innerHTML = '<option value="">No beneficiaries — add one first</option>';
      } else {
        sel.innerHTML = bens.data.map(b =>
          `<option value="${b.uuid}" data-cur="${b.currency_code}" data-country="${b.country_code}" data-name="${b.receiver_name}">${b.receiver_name} (${b.country_code} · ${b.currency_code})</option>`
        ).join('');
      }

      document.getElementById('toStep2').onclick = () => {
        const opt = sel.selectedOptions[0];
        if (!opt || !opt.value) { XMONEY.toast('Select a beneficiary', 'error'); return; }
        state.beneficiary = {
          uuid: opt.value,
          currency: opt.dataset.cur,
          country: opt.dataset.country,
          name: opt.dataset.name,
        };
        setStep(2);
      };

      document.getElementById('back1').onclick = () => setStep(1);
      document.getElementById('back2').onclick = () => setStep(2);
      document.getElementById('back3').onclick = () => setStep(3);

      async function loadQuote() {
        const amount = Number(document.getElementById('amount').value);
        if (!amount || amount <= 0) { XMONEY.toast('Enter a valid amount', 'error'); return null; }
        const res = await XMONEY.api('/v1/transfers/quote', {
          method: 'POST',
          body: {
            source_currency: document.getElementById('srcCur').value,
            target_currency: state.beneficiary.currency,
            send_amount: amount,
            destination_country: state.beneficiary.country,
          },
        });
        if (!res.success) {
          XMONEY.showAlert(document.getElementById('alert'), res.message || 'Quote failed');
          return null;
        }
        state.quote = res.data;
        const box = document.getElementById('quoteBox');
        box.hidden = false;
        box.innerHTML = `
          Market rate <strong>${res.data.market_rate}</strong> − margin <strong>${res.data.margin}</strong>
          = customer rate <strong>${res.data.customer_rate}</strong><br/>
          Receiver gets <strong>${XMONEY.formatMoney(res.data.receive_amount, res.data.target_currency)}</strong><br/>
          Fee <strong>${XMONEY.formatMoney(res.data.fee_amount, res.data.fee_currency)}</strong> ·
          Total debit <strong>${XMONEY.formatMoney(res.data.total_debit, res.data.source_currency)}</strong>`;
        return res.data;
      }

      document.getElementById('quoteBtn').onclick = () => loadQuote();

      document.getElementById('toStep3').onclick = async () => {
        const q = state.quote || await loadQuote();
        if (!q) return;
        document.getElementById('reviewBox').innerHTML = `
          <div class="xm-rate-row" style="border-color:var(--xm-border);color:inherit"><span>Receiver</span><strong>${state.beneficiary.name}</strong></div>
          <div class="xm-rate-row" style="border-color:var(--xm-border);color:inherit"><span>Corridor</span><strong>${q.source_currency} → ${q.target_currency} (${state.beneficiary.country})</strong></div>
          <div class="xm-rate-row" style="border-color:var(--xm-border);color:inherit"><span>You send</span><strong>${XMONEY.formatMoney(q.send_amount, q.source_currency)}</strong></div>
          <div class="xm-rate-row" style="border-color:var(--xm-border);color:inherit"><span>Customer rate</span><strong>${q.customer_rate}</strong></div>
          <div class="xm-rate-row" style="border-color:var(--xm-border);color:inherit"><span>They receive</span><strong>${XMONEY.formatMoney(q.receive_amount, q.target_currency)}</strong></div>
          <div class="xm-rate-row" style="border-color:var(--xm-border);color:inherit"><span>Fee</span><strong>${XMONEY.formatMoney(q.fee_amount, q.fee_currency)}</strong></div>
          <div class="xm-rate-row" style="border-color:var(--xm-border);color:inherit"><span>Total to pay</span><strong>${XMONEY.formatMoney(q.total_debit, q.source_currency)}</strong></div>`;
        setStep(3);
      };

      document.getElementById('toStep4').onclick = () => setStep(4);

      document.getElementById('payBtn').onclick = async () => {
        const btn = document.getElementById('payBtn');
        const method = document.getElementById('payMethod').value;
        if (method === 'wallet') {
          const src = document.getElementById('srcCur').value;
          const available = walletAvailable(src);
          const needed = state.quote?.total_debit || 0;
          if (available < Number(needed)) {
            XMONEY.toast('Insufficient wallet balance for this transfer', 'error');
            return;
          }
        }
        XMONEY.setLoading(btn, true, 'Processing…');

        const create = await XMONEY.api('/v1/transfers', {
          method: 'POST',
          body: {
            beneficiary_uuid: state.beneficiary.uuid,
            send_amount: state.quote.send_amount,
            source_currency: state.quote.source_currency,
            payment_method: method,
          },
        });
        if (!create.success) {
          XMONEY.setLoading(btn, false);
          XMONEY.showAlert(document.getElementById('alert'), create.message || 'Could not create transfer');
          return;
        }
        state.txn = create.data;

        const confirm = await XMONEY.api(`/v1/transfers/${create.data.uuid}/confirm`, {
          method: 'POST',
          body: { payment_method: method },
        });
        if (!confirm.success) {
          XMONEY.setLoading(btn, false);
          XMONEY.showAlert(document.getElementById('alert'), confirm.message || 'Payment failed');
          return;
        }

        if (method !== 'wallet') {
          const paymentUuid = confirm.data?.payment?.payment_uuid;
          if (paymentUuid) {
            const capture = await XMONEY.api(`/v1/payments/${paymentUuid}/simulate-capture`, { method: 'POST', body: {} });
            if (!capture.success) {
              XMONEY.setLoading(btn, false);
              XMONEY.showAlert(document.getElementById('alert'), capture.message || 'Payment capture failed');
              return;
            }
          }
        }

        XMONEY.setLoading(btn, false);
        XMONEY.toast('Transfer submitted', 'success');
        location.href = 'receipt.html?uuid=' + encodeURIComponent(create.data.uuid);
      };
    })();
  </script>
</body>
</html>
