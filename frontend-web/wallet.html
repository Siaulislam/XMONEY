<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wallet — XMONEY</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
</head>
<body>
  <div data-xm-shell>
    <div id="alert" hidden></div>
    <div class="xm-stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="xm-stat"><div class="label">Balance</div><div class="value" id="bal">—</div></div>
      <div class="xm-stat"><div class="label">Available</div><div class="value" id="avail">—</div></div>
      <div class="xm-stat"><div class="label">Held</div><div class="value" id="held">—</div></div>
    </div>
    <div class="xm-card" style="max-width:420px;margin-bottom:1.25rem">
      <h2 style="font-size:1.05rem;margin-bottom:0.75rem">Deposit (development)</h2>
      <p style="font-size:0.85rem;color:var(--xm-muted);margin-bottom:0.75rem">Credits your AED wallet for local testing. Production will use the payment provider layer.</p>
      <form id="depForm" style="display:flex;gap:0.5rem;align-items:end">
        <div class="xm-field" style="flex:1;margin:0"><label>Amount (AED)</label><input name="amount" type="number" min="1" step="0.01" required /></div>
        <button class="xm-btn xm-btn-primary" type="submit" id="depBtn">Deposit</button>
      </form>
    </div>
    <div class="xm-card">
      <h2 style="font-size:1.05rem;margin-bottom:0.75rem">History</h2>
      <div class="xm-table-wrap">
        <table class="xm-table">
          <thead><tr><th>Type</th><th>Amount</th><th>Before</th><th>After</th><th>Date</th></tr></thead>
          <tbody id="hist"><tr><td colspan="5">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script>
    async function load() {
      const [w, h] = await Promise.all([XMONEY.api('/v1/wallet'), XMONEY.api('/v1/wallet/history')]);
      if (w.success) {
        document.getElementById('bal').textContent = XMONEY.formatMoney(w.data.balance, w.data.currency);
        document.getElementById('avail').textContent = XMONEY.formatMoney(w.data.available_balance, w.data.currency);
        document.getElementById('held').textContent = XMONEY.formatMoney(w.data.held_balance, w.data.currency);
      }
      const body = document.getElementById('hist');
      if (!h.success || !h.data.length) { body.innerHTML = '<tr><td colspan="5">No wallet activity.</td></tr>'; return; }
      body.innerHTML = h.data.map(r => `
        <tr>
          <td>${r.type}</td>
          <td>${XMONEY.formatMoney(r.amount)}</td>
          <td>${XMONEY.formatMoney(r.balance_before)}</td>
          <td>${XMONEY.formatMoney(r.balance_after)}</td>
          <td>${new Date(r.created_at).toLocaleString()}</td>
        </tr>`).join('');
    }
    (async () => {
      const profile = await XMShell.mount({ title: 'Wallet', heading: 'Wallet' });
      if (!profile) return;
      document.getElementById('depForm').onsubmit = async (e) => {
        e.preventDefault();
        const amount = Number(new FormData(e.target).get('amount'));
        const btn = document.getElementById('depBtn');
        XMONEY.setLoading(btn, true, 'Depositing…');
        const res = await XMONEY.api('/v1/wallet/deposit', { method: 'POST', body: { amount, currency: 'AED' } });
        XMONEY.setLoading(btn, false);
        if (!res.success) XMONEY.showAlert(document.getElementById('alert'), res.message);
        else { XMONEY.toast('Deposit recorded', 'success'); e.target.reset(); load(); }
      };
      load();
    })();
  </script>
</body>
</html>
