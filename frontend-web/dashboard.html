<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="src/assets/branding/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="src/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="src/assets/branding/social-sharing.png" />
  <title>Dashboard — XMONEY</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
</head>
<body>
  <div data-xm-shell>
    <div id="alert" hidden></div>
    <div class="xm-wallet-hero" id="hero">
      <div class="label">Available balance</div>
      <div class="balance" id="heroBal">—</div>
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
        <a href="transfer.html" class="xm-btn xm-btn-primary">Send money</a>
        <a href="wallet.html" class="xm-btn xm-btn-secondary">Top up wallet</a>
      </div>
    </div>
    <div class="xm-stats" id="stats"></div>
    <div class="xm-grid-2">
      <div class="xm-card">
        <h2 style="font-family:var(--xm-display);font-size:1.05rem;margin-bottom:0.75rem">Transfer volume (6 months)</h2>
        <div id="volumeChart"></div>
      </div>
      <div class="xm-card">
        <h2 style="font-family:var(--xm-display);font-size:1.05rem;margin-bottom:0.75rem">Quick actions</h2>
        <div style="display:grid;gap:0.5rem">
          <a href="beneficiaries.html" class="xm-btn xm-btn-outline">Manage beneficiaries</a>
          <a href="kyc.html" class="xm-btn xm-btn-outline">KYC verification</a>
          <a href="notifications.html" class="xm-btn xm-btn-outline" id="notifLink">Notifications</a>
          <a href="transactions.html" class="xm-btn xm-btn-outline">Full transaction history</a>
        </div>
      </div>
    </div>
    <div class="xm-card" style="margin-top:1.25rem">
      <h2 style="font-family:var(--xm-display);font-size:1.15rem;margin-bottom:1rem">Recent transfers</h2>
      <div class="xm-table-wrap">
        <table class="xm-table">
          <thead><tr><th>Reference</th><th>Receiver</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="txnBody"><tr><td colspan="5">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/charts.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script>
    (async () => {
      const profile = await XMShell.mount({ title: 'Overview', heading: 'Welcome back' });
      if (!profile) return;

      const [analytics, txns] = await Promise.all([
        XMONEY.api('/v1/analytics/summary'),
        XMONEY.api('/v1/transfers?limit=8'),
      ]);

      if (analytics.success) {
        const a = analytics.data;
        const w = (a.wallets || []).find(x => x.currency_code === 'AED') || a.wallets?.[0];
        if (w) {
          document.getElementById('heroBal').textContent = XMONEY.formatMoney(w.available_balance, w.currency_code);
        }
        const t = a.transfers || {};
        XMCharts.statGrid(document.getElementById('stats'), [
          { label: 'KYC', value: profile.kyc_status },
          { label: 'Completed volume', value: XMONEY.formatMoney(t.volume_completed || 0, 'AED') },
          { label: 'In progress', value: t.in_progress || 0 },
          { label: 'Account', value: profile.status },
        ]);
        const monthly = a.monthly_volume || [];
        if (monthly.length) {
          XMCharts.barChart(
            document.getElementById('volumeChart'),
            monthly.map(m => m.period.slice(5)),
            monthly.map(m => Number(m.volume) || 0)
          );
        }
        if (a.unread_notifications > 0) {
          document.getElementById('notifLink').textContent = `Notifications (${a.unread_notifications})`;
        }
      }

      const rows = XMONEY.listData(txns);
      const body = document.getElementById('txnBody');
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="5" class="xm-empty">No transfers yet. <a href="transfer.html">Send money</a></td></tr>';
      } else {
        body.innerHTML = rows.map(t => `
          <tr>
            <td><a href="receipt.html?uuid=${t.uuid}">${t.reference_code}</a></td>
            <td>${t.receiver_name}</td>
            <td>${XMONEY.formatMoney(t.send_amount, t.source_currency)}</td>
            <td>${XMONEY.statusBadge(t.status)}</td>
            <td>${new Date(t.created_at).toLocaleString()}</td>
          </tr>`).join('');
      }
    })();
  </script>
</body>
</html>
