<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KYC — XMONEY</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
</head>
<body>
  <div data-xm-shell>
    <div id="alert" hidden></div>
    <div class="xm-card" style="max-width:480px;margin-bottom:1.25rem">
      <p style="color:var(--xm-muted);font-size:0.9rem;margin-bottom:1rem">Upload a clear photo or PDF of your identity document. Status updates after compliance review.</p>
      <form id="kycForm">
        <div class="xm-field">
          <label>Document type</label>
          <select name="document_type">
            <option value="passport">Passport</option>
            <option value="national_id">National ID</option>
            <option value="emirates_id">Emirates ID</option>
            <option value="address_proof">Address proof</option>
          </select>
        </div>
        <div class="xm-field"><label>Document number</label><input name="document_number" /></div>
        <div class="xm-field"><label>Country</label><input name="country_code" maxlength="2" placeholder="AE" /></div>
        <div class="xm-field"><label>File (JPEG, PNG, PDF)</label><input name="document" type="file" accept=".jpg,.jpeg,.png,.pdf" required /></div>
        <button class="xm-btn xm-btn-primary" type="submit" id="upBtn">Upload for review</button>
      </form>
    </div>
    <div class="xm-card">
      <h2 style="font-size:1.05rem;margin-bottom:0.75rem">Your documents</h2>
      <div id="docs">Loading…</div>
    </div>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script>
    async function load() {
      const res = await XMONEY.api('/v1/kyc');
      const el = document.getElementById('docs');
      if (!res.success || !res.data.length) { el.innerHTML = '<div class="xm-empty">No documents uploaded.</div>'; return; }
      el.innerHTML = res.data.map(d => `
        <div style="padding:0.75rem 0;border-bottom:1px solid var(--xm-border)">
          <strong>${d.document_type.replace(/_/g,' ')}</strong> ${XMONEY.statusBadge(d.status)}
          <div style="font-size:0.85rem;color:var(--xm-muted)">${d.document_number || ''} · ${new Date(d.created_at).toLocaleString()}
          ${d.rejection_reason ? '<br/>Reason: ' + d.rejection_reason : ''}</div>
        </div>`).join('');
    }
    (async () => {
      const profile = await XMShell.mount({ title: 'KYC', heading: 'KYC verification' });
      if (!profile) return;
      XMONEY.showAlert(document.getElementById('alert'), 'Current KYC status: ' + profile.kyc_status, profile.kyc_status === 'approved' ? 'success' : 'info');
      document.getElementById('kycForm').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const btn = document.getElementById('upBtn');
        XMONEY.setLoading(btn, true, 'Uploading…');
        const res = await XMONEY.api('/v1/kyc/upload', { method: 'POST', body: fd });
        XMONEY.setLoading(btn, false);
        if (!res.success) XMONEY.showAlert(document.getElementById('alert'), res.message || 'Upload failed');
        else { XMONEY.toast('Document uploaded', 'success'); e.target.reset(); load(); }
      };
      load();
    })();
  </script>
</body>
</html>
