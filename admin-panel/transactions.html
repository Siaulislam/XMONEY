<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transactions â€” XMONEY Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
</head>
<body>
  <nav class="xm-nav"><div class="xm-container xm-nav-inner"><a href="index.html" class="xm-logo"><span class="xm-logo-mark">X</span> XMONEY Admin</a></div></nav>
  <div class="xm-dash">
    <aside class="xm-sidebar">
      <a href="index.html">Dashboard</a>
      <a href="users.html">Users</a>
      <a href="kyc.html">KYC review</a>
      <a href="transactions.html" class="active">Transactions</a>
      <a href="rates.html">Rates</a>
      <a href="fees.html">Fees</a>
      <a href="currencies.html">Currencies</a>
      <a href="reports.html">Reports</a>
      <a href="audit.html">Audit logs</a>
    </aside>
    <main class="xm-main">
      <h1 style="font-family:var(--xm-display);margin-bottom:1rem">All transfers</h1>
      <div style="display:flex;gap:0.75rem;margin-bottom:1rem;flex-wrap:wrap">
        <input id="q" class="xm-field" style="margin:0;padding:0.6rem;border:1.5px solid var(--xm-border);border-radius:10px" placeholder="Search reference / name" />
        <select id="status" style="padding:0.6rem;border-radius:10px;border:1.5px solid var(--xm-border)">
          <option value="">All statuses</option>
          <option>created</option><option>pending_payment</option><option>processing</option>
          <option>under_review</option><option>completed</option><option>failed</option>
          <option>cancelled</option><option>refunded</option>
        </select>
      </div>
      <div class="xm-card">
        <div class="xm-table-wrap">
          <table class="xm-table">
            <thead><tr><th>Ref</th><th>Sender</th><th>Receiver</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script>
    if (!XMONEY.requireAuth()) throw new Error('auth');
    async function load() {
      const q = document.getElementById('q').value;
      const status = document.getElementById('status').value;
      const params = new URLSearchParams();
      if (q) params.set('q', q);
      if (status) params.set('status', status);
      const res = await XMONEY.api('/v1/admin/transactions?' + params.toString());
      document.getElementById('body').innerHTML = (res.data || []).map(t => `
        <tr>
          <td>${t.reference_code}</td>
          <td>${t.sender_name}</td>
          <td>${t.receiver_name}</td>
          <td>${XMONEY.formatMoney(t.send_amount, t.source_currency)}</td>
          <td>${XMONEY.statusBadge(t.status)}</td>
          <td>
            <select data-uuid="${t.uuid}" style="font-size:0.8rem;padding:0.3rem;border-radius:6px">
              <option value="">Updateâ€¦</option>
              <option value="processing">processing</option>
              <option value="under_review">under_review</option>
              <option value="completed">completed</option>
              <option value="failed">failed</option>
              <option value="cancelled">cancelled</option>
              <option value="refunded">refunded</option>
            </select>
          </td>
        </tr>`).join('') || '<tr><td colspan="6">No transactions</td></tr>';
      document.querySelectorAll('select[data-uuid]').forEach(sel => {
        sel.onchange = async () => {
          if (!sel.value) return;
          await XMONEY.api('/v1/admin/transactions/' + sel.dataset.uuid + '/status', {
            method: 'POST', body: { status: sel.value, note: 'Admin status update' },
          });
          load();
        };
      });
    }
    document.getElementById('q').oninput = load;
    document.getElementById('status').onchange = load;
    load();
  </script>
</body>
</html>
