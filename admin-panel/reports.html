<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="src/assets/branding/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="src/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="src/assets/branding/social-sharing.png" />
  <title>Reports — XMONEY Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
  <script src="src/assets/js/xm-theme.js"></script>
  <script src="src/assets/js/xm-i18n.js"></script>
  <script src="src/assets/js/xm-responsive.js"></script>
  <script src="src/assets/js/xm-core.js"></script>
</head>
<body>
  <nav class="xm-nav"><div class="xm-container xm-nav-inner"><a href="index.html" class="xm-logo xm-logo--admin"><img src="src/assets/branding/xmoney-logo-nav.png" alt="XMONEY" width="132" height="36" class="xm-logo-img" /><span class="xm-logo-admin-tag" data-i18n="admin.tag">Admin</span></a></div></nav>
  <div class="xm-dash">
    <aside class="xm-sidebar"></aside>
    <main class="xm-main">
      <h1 style="font-family:var(--xm-display);margin-bottom:1rem" data-i18n="admin.reportsTitle">Reports</h1>
      <div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap">
        <button class="xm-btn xm-btn-outline" data-type="daily" data-i18n="admin.daily">Daily</button>
        <button class="xm-btn xm-btn-outline" data-type="monthly" data-i18n="admin.monthly">Monthly</button>
        <button class="xm-btn xm-btn-outline" data-type="revenue" data-i18n="admin.revenue">Revenue</button>
        <button class="xm-btn xm-btn-outline" data-type="failed" data-i18n="admin.failed">Failed</button>
        <button class="xm-btn xm-btn-primary" id="exportBtn" data-i18n="common.export">Export CSV</button>
      </div>
      <div class="xm-card">
        <div class="xm-table-wrap">
          <table class="xm-table">
            <thead id="thead"><tr><th data-i18n="admin.period">Period</th><th data-i18n="admin.transactionsCount">Transactions</th><th data-i18n="common.volume">Volume</th><th data-i18n="admin.revenue">Revenue</th><th data-i18n="admin.failed">Failed</th></tr></thead>
            <tbody id="body"><tr><td colspan="5" data-i18n="admin.selectReport">Select a report type…</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script>
    (async () => {
    if (!await XMONEY_ADMIN_SHELL.mountAsync('reports.html')) return;
    const tt = (key, fallback) => (typeof XMI18n !== 'undefined' && XMI18n.t) ? XMI18n.t(key, fallback) : fallback;
    let lastRows = [];
    let lastType = 'daily';

    function render(type, rows) {
      lastType = type;
      lastRows = rows;
      const head = document.getElementById('thead');
      const body = document.getElementById('body');
      if (type === 'failed') {
        head.innerHTML = `<tr><th>${tt('txn.reference', 'Reference')}</th><th>${tt('txn.send', 'Amount')}</th><th>${tt('wallet.currency', 'Currency')}</th><th>${tt('admin.failureReason', 'Reason')}</th><th>${tt('txn.date', 'Date')}</th></tr>`;
        body.innerHTML = rows.map(r => `<tr>
          <td>${r.reference_code}</td><td>${r.send_amount}</td><td>${r.source_currency}</td>
          <td>${r.failure_reason || '—'}</td><td>${XMONEY.formatDate(r.created_at)}</td></tr>`).join('') || `<tr><td colspan="5">${tt('admin.noFailedTransactions', 'No failed transactions')}</td></tr>`;
        return;
      }
      if (type === 'revenue') {
        head.innerHTML = `<tr><th>${tt('admin.day', 'Day')}</th><th>${tt('common.volume', 'Volume')}</th><th>${tt('admin.fees', 'Fees')}</th><th>${tt('status.completed', 'Completed')}</th></tr>`;
        body.innerHTML = rows.map(r => `<tr>
          <td>${r.day}</td><td>${Number(r.volume).toLocaleString()}</td><td>${Number(r.fees).toLocaleString()}</td><td>${r.completed}</td></tr>`).join('') || `<tr><td colspan="4">${tt('common.noData', 'No data')}</td></tr>`;
        return;
      }
      head.innerHTML = `<tr><th>${tt('admin.period', 'Period')}</th><th>${tt('admin.transactionsCount', 'Transactions')}</th><th>${tt('common.volume', 'Volume')}</th><th>${tt('admin.revenue', 'Revenue')}</th><th>${tt('admin.failed', 'Failed')}</th></tr>`;
      body.innerHTML = rows.map(r => `<tr>
        <td>${r.day || r.period}</td><td>${r.txn_count}</td><td>${Number(r.volume).toLocaleString()}</td>
        <td>${Number(r.revenue).toLocaleString()}</td><td>${r.failed_count}</td></tr>`).join('') || `<tr><td colspan="5">${tt('common.noData', 'No data')}</td></tr>`;
    }

    document.querySelectorAll('[data-type]').forEach(btn => btn.onclick = async () => {
      const res = await XMONEY.api('/v1/admin/reports?type=' + btn.dataset.type);
      render(btn.dataset.type, res.data?.rows || []);
    });

    document.getElementById('exportBtn').onclick = () => {
      if (!lastRows.length) return;
      const keys = Object.keys(lastRows[0]);
      const csv = keys.join(',') + '\n' + lastRows.map(r => keys.map(k => r[k]).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = `xmoney-report-${lastType}.csv`;
      a.click();
    };
  })();
  </script>
</body>
</html>
