<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="src/assets/branding/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="src/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="src/assets/branding/social-sharing.png" />
  <title>Admin Login — XMONEY</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
  <script src="src/assets/js/app-loader.js"></script>
</head>
<body>
  <div class="xm-auth-wrap" style="background:linear-gradient(160deg,#071526,#0B1F3A)">
    <div class="xm-card xm-auth-card">
      <div class="xm-logo xm-logo--card"><img src="src/assets/branding/xmoney-logo-nav.png" alt="XMONEY" class="xm-logo-card-img" width="140" height="38" /><span class="xm-logo-admin-tag">Admin</span></div>
      <h1>Staff sign in</h1>
      <p class="sub">Authorized personnel only</p>
      <div id="alert" hidden></div>
      <form id="loginForm">
        <div class="xm-field"><label>Email</label><input name="email" type="email" required value="admin@xmoney.local" /></div>
        <div class="xm-field"><label>Password</label><input name="password" type="password" required /></div>
        <button class="xm-btn xm-btn-primary xm-btn-block" type="submit">Sign in</button>
      </form>
    </div>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script>
    if (XMONEY.getToken()) location.href = 'index.html';
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const res = await XMONEY.api('/v1/admin/auth/login', {
        method: 'POST',
        body: { email: fd.get('email'), password: fd.get('password') },
      });
      if (!res.success) {
        XMONEY.showAlert(document.getElementById('alert'), res.message || 'Login failed');
        return;
      }
      XMONEY.setSession(res.data);
      location.href = 'index.html';
    };
  </script>
</body>
</html>
