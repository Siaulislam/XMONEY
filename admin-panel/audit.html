<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="src/assets/branding/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="src/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="src/assets/branding/social-sharing.png" />
  <title>Audit Logs — XMONEY Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
  <script src="src/assets/js/xm-theme.js"></script>
  <script src="src/assets/js/xm-i18n.js"></script>
  <script src="src/assets/js/xm-responsive.js"></script>
  <script src="src/assets/js/xm-core.js"></script>
</head>
<body>
  <nav class="xm-nav"><div class="xm-container xm-nav-inner"><a href="index.html" class="xm-logo xm-logo--admin"><img src="src/assets/branding/xmoney-logo-nav.png" alt="XMONEY" width="132" height="36" class="xm-logo-img" /><span class="xm-logo-admin-tag">Admin</span></a></div></nav>
  <div class="xm-dash">
    <aside class="xm-sidebar"></aside>
    <main class="xm-main">
      <h1 style="font-family:var(--xm-display);margin-bottom:1rem">Audit logs</h1>
      <div class="xm-field" style="max-width:280px"><input id="q" placeholder="Filter by action…" /></div>
      <div class="xm-card">
        <div class="xm-table-wrap">
          <table class="xm-table">
            <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>IP</th></tr></thead>
            <tbody id="body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script>
    (async () => {
    if (!await XMONEY_ADMIN_SHELL.mountAsync('audit.html')) return;
    async function load(action='') {
      const res = await XMONEY.api('/v1/admin/audit-logs?limit=100' + (action ? '&action=' + encodeURIComponent(action) : ''));
      document.getElementById('body').innerHTML = (res.data || []).map(r => `
        <tr>
          <td>${new Date(r.created_at).toLocaleString()}</td>
          <td>${r.actor_type} #${r.actor_id || '—'}</td>
          <td><code>${r.action}</code></td>
          <td>${r.entity_type} ${r.entity_id || ''}</td>
          <td>${r.ip_address || ''}</td>
        </tr>`).join('') || '<tr><td colspan="5">No audit entries</td></tr>';
    }
    let t;
    document.getElementById('q').oninput = (e) => {
      clearTimeout(t);
      t = setTimeout(() => load(e.target.value), 250);
    };
    load();
  })();
  </script>
</body>
</html>
