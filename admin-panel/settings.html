<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="src/assets/branding/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="src/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="src/assets/branding/social-sharing.png" />
  <title>Platform settings — XMONEY Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
  <script src="src/assets/js/xm-theme.js"></script>
  <script src="src/assets/js/xm-i18n.js"></script>
  <script src="src/assets/js/xm-responsive.js"></script>
  <script src="src/assets/js/xm-core.js"></script>
</head>
<body>
  <nav class="xm-nav"><div class="xm-container xm-nav-inner"><a href="index.html" class="xm-logo xm-logo--admin"><img src="src/assets/branding/xmoney-logo-nav.png" alt="XMONEY" width="132" height="36" class="xm-logo-img" /><span class="xm-logo-admin-tag">Admin</span></a></div></nav>
  <div class="xm-dash">
    <aside class="xm-sidebar"></aside>
    <main class="xm-main">
      <h1 style="font-family:var(--xm-display);margin-bottom:1rem">Platform settings</h1>
      <p class="xm-muted">Transfer limits, security, and notification toggles.</p>
      <form id="form" class="xm-card" style="margin-top:1rem"></form>
      <button type="button" class="xm-btn xm-btn-primary" id="save" style="margin-top:1rem">Save settings</button>
    </main>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script>
    (async () => {
    if (!await XMONEY_ADMIN_SHELL.mountAsync('settings.html')) return;
    let rows = [];

    function field(row) {
      const id = 's_' + row.setting_key.replace(/\./g, '_');
      const val = row.setting_value;
      if (row.value_type === 'boolean') {
        return `<label class="xm-check"><input type="checkbox" id="${id}" data-key="${row.setting_key}" ${val ? 'checked' : ''} /> ${row.description || row.setting_key}</label>`;
      }
      return `<div class="xm-field"><label for="${id}">${row.description || row.setting_key}</label>
        <input id="${id}" data-key="${row.setting_key}" value="${val ?? ''}" /></div>`;
    }

    async function load() {
      const res = await XMONEY.api('/v1/admin/settings');
      rows = res.data || [];
      const groups = {};
      rows.forEach(r => { (groups[r.group_name] = groups[r.group_name] || []).push(r); });
      document.getElementById('form').innerHTML = Object.entries(groups).map(([g, items]) =>
        `<h3 style="margin:1rem 0 0.5rem;text-transform:capitalize">${g}</h3>${items.map(field).join('')}`
      ).join('');
    }

    document.getElementById('save').onclick = async () => {
      const payload = {};
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.dataset.key;
        const row = rows.find(r => r.setting_key === key);
        if (row?.value_type === 'boolean') payload[key] = el.checked;
        else payload[key] = el.value;
      });
      const res = await XMONEY.api('/v1/admin/settings', { method: 'PUT', body: payload });
      XMONEY.toast(res.success ? 'Settings saved' : (res.message || 'Save failed'), res.success ? 'success' : 'error');
      if (res.success) load();
    };
    load();
  })();
  </script>
</body>
</html>
