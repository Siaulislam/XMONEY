<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="src/assets/branding/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="src/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="src/assets/branding/social-sharing.png" />
  <title>Currencies — XMONEY Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
  <script src="src/assets/js/xm-theme.js"></script>
  <script src="src/assets/js/xm-i18n.js"></script>
  <script src="src/assets/js/xm-responsive.js"></script>
  <script src="src/assets/js/xm-core.js"></script>
</head>
<body>
  <nav class="xm-nav"><div class="xm-container xm-nav-inner"><a href="index.html" class="xm-logo xm-logo--admin"><img src="src/assets/branding/xmoney-logo-nav.png" alt="XMONEY" width="132" height="36" class="xm-logo-img" /><span class="xm-logo-admin-tag">Admin</span></a></div></nav>
  <div class="xm-dash">
    <aside class="xm-sidebar"></aside>
    <main class="xm-main">
      <h1 style="font-family:var(--xm-display);margin-bottom:1rem">Currency management</h1>
      <div class="xm-card" id="list">Loading…</div>
    </main>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script>
    (async () => {
    if (!await XMONEY_ADMIN_SHELL.mountAsync('currencies.html')) return;
    async function load() {
      const res = await XMONEY.api('/v1/admin/currencies');
      const el = document.getElementById('list');
      if (!res.success) { el.textContent = res.message; return; }
      el.innerHTML = `<table class="xm-table"><thead><tr><th>Code</th><th>Name</th><th>Active</th><th>Source</th><th>Destination</th><th>Actions</th></tr></thead><tbody>
        ${(res.data||[]).map(c => `<tr>
          <td><strong>${c.code}</strong> ${c.symbol}</td>
          <td>${c.name}</td>
          <td>${XMONEY.statusBadge(c.is_active == 1 ? 'active' : 'cancelled')}</td>
          <td>${c.is_source == 1 ? 'Yes' : 'No'}</td>
          <td>${c.is_destination == 1 ? 'Yes' : 'No'}</td>
          <td>
            <button class="xm-btn xm-btn-outline" style="padding:0.3rem 0.6rem;font-size:0.8rem" data-toggle="${c.code}" data-active="${c.is_active}">
              ${c.is_active == 1 ? 'Disable' : 'Enable'}
            </button>
          </td>
        </tr>`).join('')}
      </tbody></table>`;
      el.querySelectorAll('[data-toggle]').forEach(btn => {
        btn.onclick = async () => {
          const next = btn.dataset.active == '1' ? 0 : 1;
          await XMONEY.api('/v1/admin/currencies/' + btn.dataset.toggle, {
            method: 'PATCH',
            body: { is_active: next },
          });
          load();
        };
      });
    }
    load();
  })();
  </script>
</body>
</html>
