<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="src/assets/branding/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="src/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="src/assets/branding/social-sharing.png" />
  <title>KYC Review — XMONEY Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
</head>
<body>
  <nav class="xm-nav"><div class="xm-container xm-nav-inner"><a href="index.html" class="xm-logo xm-logo--admin"><img src="src/assets/branding/xmoney-logo-nav.png" alt="XMONEY" width="132" height="36" class="xm-logo-img" /><span class="xm-logo-admin-tag">Admin</span></a></div></nav>
  <div class="xm-dash">
    <aside class="xm-sidebar"></aside>
    <main class="xm-main">
      <h1 style="font-family:var(--xm-display);margin-bottom:1rem">KYC pending review</h1>
      <div id="alert" hidden></div>
      <div class="xm-card" id="list">Loading…</div>
    </main>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script>
    if (!XMONEY.requireAuth()) throw new Error('auth');
    XMONEY_ADMIN_SHELL.mount('kyc.html');

    async function viewDocument(uuid) {
      const res = await fetch(XMONEY.API_BASE + '/v1/admin/kyc/' + uuid + '/file', {
        headers: { Authorization: 'Bearer ' + XMONEY.getToken(), Accept: '*/*' },
      });
      if (!res.ok) { XMONEY.toast('Could not load document', 'error'); return; }
      const blob = await res.blob();
      window.open(URL.createObjectURL(blob), '_blank');
    }

    async function load() {
      const res = await XMONEY.api('/v1/admin/kyc/pending');
      const el = document.getElementById('list');
      if (!res.success || !res.data.length) { el.textContent = 'No pending KYC documents.'; return; }
      el.innerHTML = res.data.map(d => `
        <div style="padding:1rem 0;border-bottom:1px solid var(--xm-border)">
          <strong>${d.full_name}</strong> · ${d.email}<br/>
          <span style="color:var(--xm-muted)">${d.document_type} · ${d.document_number || '—'} · ${d.country_code || ''}</span>
          <div style="margin-top:0.6rem;display:flex;gap:0.5rem;flex-wrap:wrap">
            <button class="xm-btn xm-btn-outline" style="padding:0.4rem 0.8rem" data-view="${d.uuid}">View document</button>
            <button class="xm-btn xm-btn-primary" style="padding:0.4rem 0.8rem" data-ok="${d.uuid}">Approve</button>
            <button class="xm-btn xm-btn-danger" style="padding:0.4rem 0.8rem" data-no="${d.uuid}">Reject</button>
          </div>
        </div>`).join('');
      el.querySelectorAll('[data-view]').forEach(btn => btn.onclick = () => viewDocument(btn.dataset.view));
      el.querySelectorAll('[data-ok]').forEach(btn => btn.onclick = async () => {
        await XMONEY.api('/v1/admin/kyc/' + btn.dataset.ok + '/review', { method: 'POST', body: { decision: 'approved' } });
        XMONEY.toast('KYC approved', 'success');
        load();
      });
      el.querySelectorAll('[data-no]').forEach(btn => btn.onclick = async () => {
        const reason = prompt('Rejection reason') || 'Document not acceptable';
        await XMONEY.api('/v1/admin/kyc/' + btn.dataset.no + '/review', { method: 'POST', body: { decision: 'rejected', rejection_reason: reason } });
        XMONEY.toast('KYC rejected', 'success');
        load();
      });
    }
    load();
  </script>
</body>
</html>
