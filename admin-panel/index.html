<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="src/assets/branding/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="src/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="src/assets/branding/social-sharing.png" />
  <title>Admin Dashboard — XMONEY</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/assets/css/xmoney.css" />
  <script src="config/runtime-config.js"></script>
</head>
<body>
  <nav class="xm-nav"><div class="xm-container xm-nav-inner"><a href="index.html" class="xm-logo xm-logo--admin"><img src="src/assets/branding/xmoney-logo-nav.png" alt="XMONEY" width="132" height="36" class="xm-logo-img" /><span class="xm-logo-admin-tag">Admin</span></a></div></nav>
  <div class="xm-dash">
    <aside class="xm-sidebar"><div class="xm-sidebar-brand"><img src="src/assets/branding/xmoney-logo-nav.png" alt="XMONEY" class="xm-logo-img xm-logo-img--sidebar" width="132" height="36" /><span class="xm-logo-admin-tag">Admin</span></div></aside>
    <main class="xm-main">
      <h1 style="font-family:var(--xm-display);margin-bottom:1rem">Operations dashboard</h1>
      <div class="xm-stats" id="kpis"></div>
      <div class="xm-grid-2" style="margin-top:1.25rem">
        <div class="xm-card">
          <h2 style="font-size:1.05rem;margin-bottom:0.75rem">Daily volume & revenue (30 days)</h2>
          <div id="dailyChart"></div>
        </div>
        <div class="xm-card">
          <h2 style="font-size:1.05rem;margin-bottom:0.75rem">Top corridors</h2>
          <div class="xm-table-wrap"><table class="xm-table"><thead><tr><th>Corridor</th><th>Count</th><th>Volume</th></tr></thead><tbody id="corridors"></tbody></table></div>
        </div>
      </div>
      <div class="xm-card" style="margin-top:1.25rem">
        <h2 style="font-size:1.05rem;margin-bottom:0.75rem">Transactions by status</h2>
        <div id="statusChart"></div>
      </div>
    </main>
  </div>
  <script src="src/assets/js/api.js"></script>
  <script src="src/assets/js/shell.js"></script>
  <script src="src/assets/js/charts.js"></script>
  <script>
    if (!XMONEY.requireAuth()) throw new Error('auth');
    XMONEY_ADMIN_SHELL.mount('index.html');
    (async () => {
      const [dash, analytics] = await Promise.all([
        XMONEY.api('/v1/admin/dashboard'),
        XMONEY.api('/v1/admin/analytics?days=30'),
      ]);
      if (dash.success) {
        const d = dash.data;
        const k = analytics.success ? analytics.data.kpis : {};
        document.getElementById('kpis').innerHTML = [
          ['Users', d.users_total], ['Active', d.users_active], ['KYC pending', d.kyc_pending],
          ['Volume today', Number(d.volume_today).toLocaleString()], ['Revenue today', Number(k.revenue_today || 0).toLocaleString()],
          ['In process', d.transactions_processing], ['Payments pending', k.payments_pending || 0], ['Top-ups today', k.wallet_topups_today || 0],
        ].map(([label, value]) => `<div class="xm-stat"><div class="label">${label}</div><div class="value">${value}</div></div>`).join('');
      }
      if (analytics.success) {
        const daily = analytics.data.daily || [];
        if (daily.length) {
          XMCharts.barChart(document.getElementById('dailyChart'),
            daily.map(r => String(r.day).slice(5)),
            daily.map(r => Number(r.volume) || 0), 'var(--xm-blue)');
        }
        document.getElementById('corridors').innerHTML = (analytics.data.top_corridors || []).map(c =>
          `<tr><td>${c.source_currency} → ${c.target_currency}</td><td>${c.count}</td><td>${Number(c.volume).toLocaleString()}</td></tr>`
        ).join('') || '<tr><td colspan="3">No data</td></tr>';
        const byStatus = analytics.data.by_status || [];
        if (byStatus.length) {
          XMCharts.barChart(document.getElementById('statusChart'),
            byStatus.map(s => s.status),
            byStatus.map(s => Number(s.count) || 0), 'var(--xm-teal)');
        }
      }
    })();
  </script>
</body>
</html>
