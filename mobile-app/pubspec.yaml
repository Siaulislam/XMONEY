name: xmoney_app
description: XMONEY — International money transfer (Android & iOS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/branding/xmoney-logo.png
    - assets/branding/xmoney-logo-full.png
    - assets/branding/xmoney-monogram.png
    - assets/branding/splash-android.png
    - assets/branding/splash-ios.png
    - assets/branding/app-icon-1024.png
    - assets/i18n/en.json
    - assets/i18n/ar.json
    - assets/i18n/ur.json
    - assets/data/country_currencies.json
    - assets/data/country_wallet_providers.json
    - assets/data/local_banks.json
    - assets/flags/
